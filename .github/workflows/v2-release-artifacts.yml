name: v2 release artifacts

on:
  push:
    branches:
      - v2.0-marshmallow-dev
    tags:
      # Release tags for this fork, e.g. v2.0.26-marshmallow. Pushing one builds and
      # uploads the same zip/setup artifacts as a branch build, named after the tag.
      - 'v2.0.*-marshmallow'
  pull_request:
    branches:
      - v2.0-marshmallow-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-release-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022

    # Overrides the workflow-wide contents: read above. Needed only so a tag build can
    # publish a GitHub Release; branch and pull_request builds never reach that step.
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          repository: AutoHotkey/AutoHotkeyDocs
          ref: v2
          path: externals/AutoHotkeyDocs

      - name: Checkout UX assets
        uses: actions/checkout@v4
        with:
          repository: AutoHotkey/AutoHotkeyUX
          path: externals/AutoHotkeyUX

      - name: Checkout packaging assets
        uses: actions/checkout@v4
        with:
          repository: Lexikos/AutoHotkey-Release
          path: externals/AutoHotkey-Release

      # Ahk2Exe is an AutoHotkey v1.1 script, so it cannot run on the v2 binaries built here --
      # it needs a v1.1 32-bit Unicode base. Our v1.1 line carries the same window-class rename,
      # so building it is what lets the shipped compiler have this fork's identity too.
      - name: Checkout v1.1 source
        uses: actions/checkout@v4
        with:
          ref: v1.1-marshmallow-dev
          path: externals/AutoHotkey-v1.1

      - name: Checkout Ahk2Exe source
        uses: actions/checkout@v4
        with:
          repository: AutoHotkey/Ahk2Exe
          fetch-depth: 0
          path: externals/Ahk2Exe

      # Ahk2Exe and the bundled UX launcher/installer locate interpreters by filename, all of
      # them looking for the stock "AutoHotkey*.exe". None of them can see the binaries this fork
      # builds, which is why Ahk2Exe reports "AutoHotkey could not be located!" even when the files
      # sit right beside it. Rewrite those name patterns to ours. Every edit asserts how many
      # occurrences it expects, so an upstream change fails the build here rather than silently
      # producing a package whose launcher finds no interpreter.
      # (Ahk2Exe itself is patched in "Build Ahk2Exe from source" below, because the git checkout
      # in that step would revert an edit made here.)
      - name: Patch bundled tooling for renamed binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Edit-Source([string]$Path, [string]$Find, [string]$Replace, [int]$Expected) {
            if (!(Test-Path $Path)) { throw "Not found: $Path" }
            # These are UTF-8-with-BOM AutoHotkey sources; v1 reads a BOM-less file as ANSI, so the
            # BOM has to survive the rewrite.
            $bytes = [IO.File]::ReadAllBytes($Path)
            $bom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $skip = if ($bom) { 3 } else { 0 }
            $text = [Text.Encoding]::UTF8.GetString($bytes, $skip, $bytes.Length - $skip)
            $count = ([regex]::Matches($text, [regex]::Escape($Find))).Count
            if ($count -ne $Expected) {
              throw "$Path : expected $Expected occurrence(s) of [$Find], found $count. Upstream changed; update this patch."
            }
            [IO.File]::WriteAllText($Path, $text.Replace($Find, $Replace), (New-Object Text.UTF8Encoding $bom))
            Write-Host "patched $Path ($count)"
          }

          $ux  = Join-Path $PWD 'externals\AutoHotkeyUX'
          $rel = Join-Path $PWD 'externals\AutoHotkey-Release\include-v2'

          # Launcher: picks the interpreter that runs .ahk files.
          Edit-Source "$ux\inc\launcher-common.ahk" "ROOT_DIR '\AutoHotkey*.exe'" "ROOT_DIR '\LastGastWater*.exe'" 1
          # Installer: enumerates interpreters to install, and to build UIA variants of.
          Edit-Source "$ux\install.ahk" "this.SourceDir '\AutoHotkey*.exe'" "this.SourceDir '\LastGastWater*.exe'" 2
          # Installer: the file list deciding which core files get installed at all.
          Edit-Source "$ux\install.ahk" "'AutoHotkey*.exe', 'AutoHotkey.chm'" "'LastGastWater*.exe', 'AutoHotkey.chm'" 1
          # Installer self-update runs the 32-bit interpreter out of the source directory.
          Edit-Source "$ux\install-version.ahk" 'AutoHotkey32.exe' 'LastGastWater32.exe' 2
          # v1 reload helper resolves the interpreter one level up from UX\.
          Edit-Source "$ux\reload-v1.ahk" 'AutoHotkey32.exe' 'LastGastWater32.exe' 1
          # Portable entry point shipped in the zip.
          Edit-Source "$rel\Install.cmd" 'AutoHotkey32.exe' 'LastGastWater32.exe' 1
          # The setup script names its own base file through an Ahk2Exe directive.
          Edit-Source "$rel\AutoHotkey_setup.ahk" '%A_ScriptDir%\AutoHotkey32.exe' '%A_ScriptDir%\LastGastWater32.exe' 1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # The html-help-workshop package fetches htmlhelp.exe from a web.archive.org snapshot --
      # Microsoft removed the original download -- and archive.org answers 503 when it throttles,
      # which fails the package's install script and so the whole run. Retry on the same schedule
      # as the Ahk2Exe downloads below rather than losing a build to one throttled request.
      - name: Install HTML Help Workshop
        shell: pwsh
        run: |
          # choco reports failure through its exit code. Keep native non-zero exits from
          # throwing (pwsh 7.4+ does by default under 'Stop') so the retry loop can see them.
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }
          for ($i = 1; $i -le 4; $i++) {
            # --force from the second attempt on, so choco re-runs the install script instead of
            # reporting the half-installed package from the failed attempt as already present.
            $extra = if ($i -eq 1) { @() } else { @('--force') }
            choco install html-help-workshop --no-progress -y @extra
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 4) { throw "choco install html-help-workshop failed after 4 attempts (exit $LASTEXITCODE)." }
            $wait = [math]::Pow(2, $i)
            Write-Host "Attempt $i failed (exit $LASTEXITCODE); retrying in $wait s"
            Start-Sleep -Seconds $wait
          }

      - name: Compute artifact metadata
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # Name a tag build after the tag that triggered it. git describe is not safe here:
            # when several tags point at the same commit it may pick any one of them, which
            # would silently drop the -marshmallow suffix from the artifact names.
            $describe = $env:GITHUB_REF_NAME
          } else {
            $describe = (git describe --tags --dirty --match "v*").Trim()
          }
          if (-not $describe) {
            throw "Unable to derive a version from git describe."
          }
          Write-Host "Building version from: $describe"

          $version = $describe.Substring(1)
          $version = $version -replace '-(?=\d+-)', '+'
          $version = $version -replace '-g', '+'
          $version = $version -replace '-dirty$', '+dirty'

          "version=$version" >> $env:GITHUB_OUTPUT
          "zip_name=AutoHotkey_${version}.zip" >> $env:GITHUB_OUTPUT
          "setup_name=AutoHotkey_${version}_setup.exe" >> $env:GITHUB_OUTPUT

      - name: Build Win32 release
        shell: cmd
        run: msbuild AutoHotkeyx.sln /m /t:Build /p:Configuration=Release /p:Platform=Win32

      - name: Build x64 release
        shell: cmd
        run: msbuild AutoHotkeyx.sln /m /t:Build /p:Configuration=Release /p:Platform=x64

      # The .vcxproj derives the version resource from its own `git describe`, independently of the
      # artifact names computed above. When the two disagree the mismatch is invisible in CI but
      # breaks Ahk2Exe, which parses the version resource to decide whether a file is a usable base
      # file or interpreter. Fail loudly here instead of shipping binaries that disagree with the
      # tag they were built from.
      - name: Verify stamped version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stamped = (Get-Item "$PWD\bin\LastGastWater64.exe").VersionInfo.FileVersion
          Write-Host "Stamped FileVersion: $stamped"
          Write-Host "Expected version:    ${{ steps.meta.outputs.version }}"

          # Only tag builds are asserted. A branch build is expected to carry a describe-derived
          # "2.0.26+15+36fc12ba" version, which is deliberately not a shape Ahk2Exe accepts.
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            Write-Host "Not a tag build; skipping assertions."
            exit 0
          }

          if ($stamped -ne '${{ steps.meta.outputs.version }}') {
            throw "Version resource '$stamped' does not match the build version '${{ steps.meta.outputs.version }}'."
          }
          # Ahk2Exe splits on "." and "-" and requires the third field to be numeric before it will
          # offer the file as a base file (Ahk2Exe.ahk, FindBinsExes).
          $third = ($stamped -split '[.\-]')[2]
          if ($third -notmatch '^\d+$') {
            throw "Version '$stamped' has non-numeric third field '$third'; Ahk2Exe would reject this build."
          }

      # Produces externals\AutoHotkey-v1.1\bin\AutoHotkeyU32.exe, the base Ahk2Exe is compiled
      # onto. Release|Win32 is the Unicode configuration -- the "(mbcs)" ones are ANSI, and the
      # U/A suffix in the target name follows CharacterSet.
      - name: Build v1.1 Unicode 32-bit release
        shell: cmd
        run: msbuild externals\AutoHotkey-v1.1\AutoHotkeyx.sln /m /t:Build /p:Configuration=Release /p:Platform=Win32

      # Ahk2Exe is needed twice below: to compile the installer, and to compile Ahk2Exe itself
      # from source. It cannot be built from scratch -- per its README it "must be compiled with
      # itself" -- so one prebuilt copy is bootstrapped from upstream here. Every *base* file used
      # afterwards is one we built. Downloads are retried; a transport failure here has broken CI.
      - name: Install Ahk2Exe toolchain
        id: toolchain
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $PWD '.ahk2exe'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null

          function Save-Asset([string]$Url, [string]$Dest) {
            # Fail loudly on a missing URL rather than retrying an empty request four times.
            if ([string]::IsNullOrWhiteSpace($Url)) { throw "No download URL resolved for '$Dest'." }
            for ($i = 1; $i -le 4; $i++) {
              try {
                Invoke-WebRequest -Uri $Url -OutFile $Dest -UseBasicParsing
                return
              } catch {
                if ($i -eq 4) { throw "Download failed after 4 attempts: $Url`n$($_.Exception.Message)" }
                $wait = [math]::Pow(2, $i)
                Write-Host "Attempt $i failed ($($_.Exception.Message)); retrying in $wait s"
                Start-Sleep -Seconds $wait
              }
            }
          }

          # gh is authenticated, so the release lookup uses the per-repo API quota.
          $json = gh api repos/AutoHotkey/Ahk2Exe/releases/latest
          if ($LASTEXITCODE -ne 0) { throw "Could not query the Ahk2Exe release." }
          $release = $json | ConvertFrom-Json
          $tag = $release.tag_name
          $assets = @{}
          foreach ($a in $release.assets) { $assets[$a.name] = $a.browser_download_url }
          if ($assets.Count -eq 0) { throw "The Ahk2Exe release publishes no assets." }
          Write-Host "Ahk2Exe $tag assets: $($assets.Keys -join ', ')"

          $zips = @($assets.Keys | Where-Object { $_ -like '*.zip' })
          if ($zips.Count -eq 0) { throw "The Ahk2Exe release has no .zip asset." }
          foreach ($zip in $zips) {
            $path = Join-Path $tools $zip
            Save-Asset $assets[$zip] $path
            Expand-Archive -Path $path -DestinationPath $tools -Force
          }

          $ahk2exe = Get-ChildItem -Path $tools -Recurse -Filter 'Ahk2Exe.exe' | Select-Object -First 1
          if (-not $ahk2exe) { throw "Ahk2Exe.exe was not found in the Ahk2Exe release assets." }
          Write-Host "Ahk2Exe: $($ahk2exe.FullName)"
          $toolDir = Split-Path $ahk2exe.FullName -Parent

          # BinMod.exe backs the ;@Ahk2Exe-Set* directives used by both scripts compiled below.
          # It is not a release asset -- it lives in the Ahk2Exe source tree, so it is read at the
          # release tag. BinMod.ahk is a v1 script, so it compiles onto Ahk2Exe.exe (itself v1).
          $binModSrc = Join-Path $tools 'BinMod.ahk'
          Save-Asset "https://raw.githubusercontent.com/AutoHotkey/Ahk2Exe/refs/tags/$tag/BinMod.ahk" $binModSrc
          if ((Get-Item $binModSrc).Length -eq 0) { throw "Downloaded BinMod.ahk is empty." }
          $binModExe = Join-Path $toolDir 'BinMod.exe'
          $p = Start-Process -FilePath $ahk2exe.FullName -NoNewWindow -Wait -PassThru -ArgumentList @(
            '/silent', 'verbose', '/in', $binModSrc, '/out', $binModExe, '/base', $ahk2exe.FullName, '/compress', '0')
          if ($p.ExitCode -ne 0 -or !(Test-Path $binModExe)) {
            throw "Failed to build BinMod.exe (Ahk2Exe exited with $($p.ExitCode))."
          }

          # Ahk2Exe.ahk carries ";@Ahk2Exe-Base %A_AhkPath%\..\AutoHotkeyU32.exe". For a compiled
          # v1 script with no AutoHotkey installed, A_AhkPath resolves beside the running exe, so
          # placing our v1.1 build next to Ahk2Exe.exe makes that directive and the explicit /base
          # below name the same file -- no reliance on which of the two wins.
          $u32 = Join-Path $PWD 'externals\AutoHotkey-v1.1\bin\AutoHotkeyU32.exe'
          if (!(Test-Path $u32)) { throw "v1.1 base not found (the v1.1 build should have produced it): $u32" }
          Copy-Item $u32 (Join-Path $toolDir 'AutoHotkeyU32.exe') -Force

          "ahk2exe=$($ahk2exe.FullName)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build help file
        shell: pwsh
        run: |
          $docs = Join-Path $PWD 'externals\AutoHotkeyDocs'

          $hhc = @(
            (Join-Path $env:ProgramFiles 'HTML Help Workshop\hhc.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'HTML Help Workshop\hhc.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $hhc) {
            throw "hhc.exe not found; the HTML Help Workshop install did not provide it."
          }
          Write-Host "Using $hhc"

          # compile_chm.ahk reads docs\static\source\data_index.js and writes Index.hhk using paths
          # relative to the *working directory*, so it has to run from the docs checkout.  And
          # LastGastWater32.exe is a GUI-subsystem binary, which PowerShell's call operator does not
          # wait for -- Start-Process -PassThru + WaitForExit is what makes this step synchronous.
          # /ErrorStdOut keeps a script error on the log instead of in a modal dialog nobody can close.
          $proc = Start-Process -FilePath "$PWD\bin\LastGastWater32.exe" `
            -ArgumentList @('/ErrorStdOut', "$docs\compile_chm.ahk") `
            -WorkingDirectory $docs -NoNewWindow -PassThru
          if (-not $proc.WaitForExit(600000)) {
            $proc.Kill()
            throw "compile_chm.ahk did not finish within 10 minutes."
          }
          if (!(Test-Path "$docs\AutoHotkey.chm")) {
            throw "AutoHotkey.chm was not created (AutoHotkey exited with $($proc.ExitCode))."
          }

      - name: Stage release contents
        shell: pwsh
        run: |
          $stageRoot = Join-Path $PWD 'externals\AutoHotkey-Release\include-v2'
          $uxRoot = Join-Path $stageRoot 'UX'

          Remove-Item $uxRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stageRoot 'LastGastWater32.exe') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stageRoot 'LastGastWater64.exe') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stageRoot 'AutoHotkey.chm') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stageRoot '~FileInstall.ahk') -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $uxRoot -Force | Out-Null

          Copy-Item "$PWD\bin\LastGastWater32.exe" $stageRoot -Force
          Copy-Item "$PWD\bin\LastGastWater64.exe" $stageRoot -Force
          Copy-Item "$PWD\externals\AutoHotkeyDocs\AutoHotkey.chm" $stageRoot -Force
          Copy-Item "$PWD\externals\AutoHotkeyUX\*.ahk" $uxRoot -Force
          Copy-Item "$PWD\externals\AutoHotkeyUX\inc" (Join-Path $uxRoot 'inc') -Recurse -Force
          Copy-Item "$PWD\externals\AutoHotkeyUX\Templates" (Join-Path $uxRoot 'Templates') -Recurse -Force
          # Compiler\ is appended so make-v2-setup.ahk emits FileInstall lines for the Ahk2Exe
          # built below; the upstream list predates us shipping a compiler.
          # The interpreter entries are rewritten to this fork's names as well: make-v2-setup.ahk
          # emits nothing at all for a list entry matching no file, so a stale name here would
          # produce an installer carrying no interpreter rather than a visible failure.
          $zipList = "$PWD\externals\AutoHotkey-Release\zip-files-alpha.txt"
          (Get-Content "$PWD\externals\AutoHotkey-Release\zip-files-v2.0.txt") `
            -replace '^AutoHotkey32\.exe$', 'LastGastWater32.exe' `
            -replace '^AutoHotkey64\.exe$', 'LastGastWater64.exe' | Set-Content $zipList
          Add-Content $zipList "Compiler"
          foreach ($want in 'LastGastWater32.exe', 'LastGastWater64.exe') {
            if ((Get-Content $zipList) -notcontains $want) { throw "$want missing from $zipList" }
          }

      # Compiles Ahk2Exe onto our own v1.1 build, so the shipped compiler carries this fork's
      # window identity rather than stock AutoHotkey's. This must run before the installer payload
      # is generated, because that step scans include-v2 to build its FileInstall manifest.
      - name: Build Ahk2Exe from source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ahk2exe = '${{ steps.toolchain.outputs.ahk2exe }}'
          $src = Join-Path $PWD 'externals\Ahk2Exe'
          $u32 = Join-Path $PWD 'externals\AutoHotkey-v1.1\bin\AutoHotkeyU32.exe'

          # "Must be compiled with itself (same version)" -- pin the source to the same tag the
          # bootstrap compiler came from, rather than whatever master happens to be.
          git -C $src checkout --quiet '${{ steps.toolchain.outputs.tag }}'
          if ($LASTEXITCODE -ne 0) { throw "Could not check out Ahk2Exe at tag ${{ steps.toolchain.outputs.tag }}." }

          # FindBinsExes skips any file not matching "*.bin", "AutoHotkey*.exe" or "Ahk2Exe.exe"
          # before it ever reads the version resource, so this fork's binaries are invisible to the
          # base-file scan and to the interpreter lookup Compiler.ahk does through ExeFiles[].
          $ahkSrc = Join-Path $src 'Ahk2Exe.ahk'
          $bytes = [IO.File]::ReadAllBytes($ahkSrc)
          $bom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
          $skip = if ($bom) { 3 } else { 0 }
          $text = [Text.Encoding]::UTF8.GetString($bytes, $skip, $bytes.Length - $skip)
          $find = '^AutoHotkey.+\.exe$|^Ahk2Exe\.exe$'
          if (([regex]::Matches($text, [regex]::Escape($find))).Count -ne 1) {
            throw "Ahk2Exe.ahk: base-file name filter not found as expected; upstream changed, update this patch."
          }
          [IO.File]::WriteAllText($ahkSrc, $text.Replace($find, '^AutoHotkey.+\.exe$|^LastGastWater.+\.exe$|^Ahk2Exe\.exe$'), (New-Object Text.UTF8Encoding $bom))
          Write-Host "Patched Ahk2Exe.ahk base-file name filter"

          $compilerDir = Join-Path $PWD 'externals\AutoHotkey-Release\include-v2\Compiler'
          New-Item -ItemType Directory -Path $compilerDir -Force | Out-Null
          $out = Join-Path $compilerDir 'Ahk2Exe.exe'

          Write-Host "Compiling Ahk2Exe.ahk onto our v1.1 base $u32"
          $p = Start-Process -FilePath $ahk2exe -NoNewWindow -Wait -PassThru -ArgumentList @(
            '/silent', 'verbose', '/in', (Join-Path $src 'Ahk2Exe.ahk'), '/out', $out, '/base', $u32, '/compress', '0')
          if ($p.ExitCode -ne 0) { throw "Ahk2Exe failed to compile itself (exit $($p.ExitCode))." }
          if (!(Test-Path $out)) { throw "Ahk2Exe.exe was not produced: $out" }
          Write-Host "Built $out ($((Get-Item $out).Length) bytes)"

      - name: Generate installer payload
        shell: pwsh
        run: |
          $release = Join-Path $PWD 'externals\AutoHotkey-Release'

          # Same two constraints as the help-file step: make-v2-setup.ahk starts with
          # SetWorkingDir "include-v2", which is resolved against the caller's working directory,
          # and the process must be waited on because LastGastWater32.exe is GUI-subsystem.
          $proc = Start-Process -FilePath "$PWD\bin\LastGastWater32.exe" `
            -ArgumentList @('/ErrorStdOut', "$release\make-v2-setup.ahk", 'skip-compile') `
            -WorkingDirectory $release -NoNewWindow -PassThru
          if (-not $proc.WaitForExit(600000)) {
            $proc.Kill()
            throw "make-v2-setup.ahk did not finish within 10 minutes."
          }
          if (!(Test-Path "$release\include-v2\~FileInstall.ahk")) {
            throw "Installer payload manifest was not created (AutoHotkey exited with $($proc.ExitCode))."
          }

      - name: Create dist directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path "$PWD\dist" -Force | Out-Null

      # Ahk2Exe embeds the script into a base executable, so the base becomes the installer's
      # own runtime. It must be the AutoHotkey we just built -- AutoHotkey_setup.ahk asks for
      # exactly that with ";@Ahk2Exe-Base %A_ScriptDir%\LastGastWater32.exe" -- otherwise the
      # installer ships as a stock AutoHotkey binary carrying upstream's window identity.
      - name: Compile setup executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ahk2exe = '${{ steps.toolchain.outputs.ahk2exe }}'
          $base = Join-Path $PWD 'externals\AutoHotkey-Release\include-v2\LastGastWater32.exe'
          $in = Join-Path $PWD 'externals\AutoHotkey-Release\include-v2\AutoHotkey_setup.ahk'
          $out = Join-Path $PWD 'dist\${{ steps.meta.outputs.setup_name }}'
          if (!(Test-Path $base)) { throw "Base file not found (staging step should have copied it): $base" }
          Write-Host "Compiling $in onto our own base $base"

          $p = Start-Process -FilePath $ahk2exe -NoNewWindow -Wait -PassThru -ArgumentList @(
            '/silent', 'verbose', '/in', $in, '/out', $out, '/base', $base, '/compress', '0')
          if ($p.ExitCode -ne 0) { throw "Ahk2Exe failed (exit $($p.ExitCode))." }
          if (!(Test-Path $out)) { throw "Setup executable was not produced: $out" }

      - name: Create zip artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$PWD\dist" -Force | Out-Null
          $stageRoot = Join-Path $PWD 'externals\AutoHotkey-Release\include-v2'
          $zipPath = Join-Path $PWD "dist\${{ steps.meta.outputs.zip_name }}"

          Push-Location $stageRoot
          try {
            if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
            }
            Compress-Archive -Path 'LastGastWater32.exe', 'LastGastWater64.exe', 'AutoHotkey.chm', 'WindowSpy.ahk', 'license.txt', 'Install.cmd', 'UX', 'Compiler' -DestinationPath $zipPath -CompressionLevel Optimal
          }
          finally {
            Pop-Location
          }

      - name: Verify packaged artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Item "$PWD\dist\${{ steps.meta.outputs.setup_name }}" | Out-Null
          $zipPath = (Get-Item "$PWD\dist\${{ steps.meta.outputs.zip_name }}").FullName

          # The rename spans the build, the installer manifest and six bundled scripts, so confirm
          # the binaries really arrived under their new names instead of trusting that chain.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try { $names = @($zip.Entries.FullName) } finally { $zip.Dispose() }
          foreach ($want in 'LastGastWater32.exe', 'LastGastWater64.exe', 'Compiler/Ahk2Exe.exe') {
            if ($names -notcontains $want) { throw "Missing from zip: $want`nZip contains: $($names -join ', ')" }
          }
          if ($names -match '^AutoHotkey\d+\.exe$') { throw "A stock-named interpreter is still in the zip." }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoHotkey-${{ steps.meta.outputs.version }}
          path: |
            dist/${{ steps.meta.outputs.setup_name }}
            dist/${{ steps.meta.outputs.zip_name }}
          if-no-files-found: error

      # Workflow artifacts above expire (90 days by default), so a tag build also publishes
      # a GitHub Release, which keeps the zip and installer permanently downloadable.
      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "dist/${{ steps.meta.outputs.zip_name }}"
          $setup = "dist/${{ steps.meta.outputs.setup_name }}"

          # Idempotent, so re-running a tag build refreshes the assets instead of failing.
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title $tag --notes "Automated build of $tag."
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed for $tag." }
          } else {
            Write-Host "Release $tag already exists; updating its assets."
          }

          gh release upload $tag $zip $setup --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed for $tag." }
